<div class="container">
  <p-table
    #dt2
    [value]="segDocumentList"
    dataKey="SegId"
    [rows]="25"
    [rowsPerPageOptions]="[10, 25, 50]"
    [paginator]="true"
    class="styled-table"
  >
    <ng-template #header>
      <tr>
        <th>Seg Id</th>
        <th>Seg Name</th>
        <th>Creation Date</th>
        <th>Created By</th>
        <th>Doc Name</th>
        <!-- <th>Training Program</th> -->
        <th>Functions</th>
      </tr>
      <tr>
        <th>
          <p-columnFilter
            type="text"
            field="SegId"
            placeholder="Search by ID"
            ariaLabel="Filter ID"
          ></p-columnFilter>
        </th>
        <th>
          <p-columnFilter
            type="text"
            field="SegName"
            placeholder="Search by Name"
            ariaLabel="Filter Name"
          ></p-columnFilter>
        </th>
        <th>
          <p-columnFilter
            type="date"
            field="CreationDate"
            placeholder="Search by Date"
            ariaLabel="Filter Created By"
          ></p-columnFilter>

        </th>
        <th>
          <p-columnFilter
            type="text"
            field="CreatedBy"
            placeholder="Search by Creator"
            ariaLabel="Filter Created By"
          ></p-columnFilter>
        </th>
        <th>
          <p-columnFilter
            type="text"
            field="DocName"
            placeholder="Search by Document"
          ></p-columnFilter>
        </th>
        <!-- <th>
          <p-columnFilter
            type="text"
            field="TrainingProgram"
            placeholder="Search by Program"
          ></p-columnFilter>
        </th> -->
        <th>Functions</th>
      </tr>
    </ng-template>

    <ng-template #body let-seg>
      <tr>
        <td>{{ seg.segId }}</td>
        <td>{{ seg.segName }}</td>
        <td>{{ seg.creationDate | date: 'yyyy/MM/dd' }}</td>

        <td>{{ seg.createdBy }}</td>
        <td>{{ seg.docName }}</td>
        <!-- <td>{{ seg.TrainingProgram }}</td> -->
        <td>
          <p-button (onClick)="editSeg(seg.segId)" severity="success" class="edit-btn">Edit</p-button>
          <p-button (onClick)="deleteSeg(seg.segId)" severity="danger" class="delete-btn">Delete</p-button>
        </td>
      </tr>
    </ng-template>

    <ng-template #emptymessage>
      <tr>
        <td colspan="7">No records found.</td>
      </tr>
    </ng-template>
  </p-table>
</div>
